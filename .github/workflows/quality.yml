name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development tools
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run quality gate
        shell: pwsh
        run: pwsh scripts/check_quality.ps1

      - name: Verify Windows junction tests executed
        # Explicitly run the junction tests so CI logs prove they were
        # collected and passed — not just inferred from a green Quality job.
        # The full suite (in check_quality.ps1) already includes them, but
        # this targeted run makes the junction test count visible in the
        # step output. On Windows runners these MUST execute (not skip).
        shell: pwsh
        run: python -m pytest -m windows_junction -ra --no-cov
